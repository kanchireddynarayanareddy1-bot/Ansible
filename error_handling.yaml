- name: error handling
  hosts: local
  connection: local
  tasks:
   - name: check if user exit or not 
     ansible.builtin.command: id roboshop
     register: user_output
     ignore_errors: true
   - name: print the o/p
     ansible.builtin.debug:
      msg: "{{ user_output }}"  
   - name: create user
     ansible.builtin.command: useradd roboshop
     when: user_output.rc != 0   